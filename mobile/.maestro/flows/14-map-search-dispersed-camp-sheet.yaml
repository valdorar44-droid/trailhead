appId: ${APP_ID}
name: Dispersed campground opens stable Peek and Full sheets
tags:
  - search
  - map
  - sheets
  - camp
  - dispersed
  - delta
---
- launchApp:
    clearState: false
    stopApp: true
- tapOn: "Map tab"
- extendedWaitUntil:
    visible:
      id: "map.search.inline.input"
    timeout: 20000
- tapOn:
    id: "map.search.inline.input"
- eraseText: 80
- inputText: "Willow Springs Road dispersed camping"
- extendedWaitUntil:
    visible:
      id: "map.search.inline.result.place:blm:ut-moab-camp-001"
    timeout: 30000
- tapOn:
    id: "map.search.inline.result.place:blm:ut-moab-camp-001"
- extendedWaitUntil:
    visible:
      id: "place-sheet-camp-camp-place-blm-ut-moab-camp-001-peek"
    timeout: 15000
- assertVisible: "Willow Springs Dispersed Camping"
- assertVisible: "SITE TYPE"
- assertVisible: "INVENTORY"
- assertVisible: "FEE"
- takeScreenshot: dispersed-camp-peek
- tapOn:
    id: "place-sheet-camp-camp-place-blm-ut-moab-camp-001-view-sites"
- extendedWaitUntil:
    visible:
      id: "place-sheet-camp-camp-place-blm-ut-moab-camp-001"
    timeout: 20000
- runFlow:
    when:
      visible: "Some details are unavailable"
    commands:
      - tapOn: "Retry"
      - extendedWaitUntil:
          notVisible: "Some details are unavailable"
          timeout: 30000
- assertNotVisible: "Some details are unavailable"
- assertVisible: "Willow Springs Dispersed Camping"
- takeScreenshot: dispersed-camp-full
- tapOn:
    id: "place-sheet-camp-camp-place-blm-ut-moab-camp-001-close"
- extendedWaitUntil:
    notVisible:
      id: "place-sheet-camp-camp-place-blm-ut-moab-camp-001"
    timeout: 15000
