appId: ${APP_ID}
name: Search returns a canonical result
tags:
  - search
  - current-selectors
---
- launchApp:
    clearState: false
    stopApp: true
- scrollUntilVisible:
    element:
      text: "Find your next adventure"
    direction: DOWN
    timeout: 20000
    speed: 80
- tapOn: "Explore tab"
- runFlow:
    when:
      visible:
        id: "explore.search.open"
    commands:
      - tapOn:
          id: "explore.search.open"
- runFlow:
    when:
      visible:
        id: "explore.search.input"
    commands:
      - tapOn:
          id: "explore.search.input"
- runFlow:
    when:
      visible: "Search camps, trails, fuel"
    commands:
      - tapOn: "Search camps, trails, fuel"
- runFlow:
    when:
      visible: "Search camps, trails, and places"
    commands:
      - tapOn: "Search camps, trails, and places"
- runFlow:
    when:
      visible:
        id: "search-v2.input"
    commands:
      - tapOn:
          id: "search-v2.input"
- runFlow:
    when:
      visible:
        id: "search-v2.clear"
    commands:
      - tapOn:
          id: "search-v2.clear"
- inputText: "Yellowstone National Park"
- extendedWaitUntil:
    visible:
      id: "search-v2.result.place:nps:yell"
    timeout: 20000
- assertVisible:
    id: "search-v2.result.place:nps:yell"
- assertVisible:
    id: "search-v2.results"
- assertNotVisible: "No matches found"
- takeScreenshot: search-canonical-result
- eraseText: 25
- hideKeyboard
- tapOn:
    id: "search-v2.cancel"
