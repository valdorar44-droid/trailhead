name: Trailhead CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trailhead-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and catalog contracts
    runs-on: ubuntu-latest
    env:
      TRAILHEAD_DB_PATH: /tmp/trailhead-ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci --ignore-scripts

      - name: Compile backend
        run: python -m py_compile dashboard/server.py db/store.py db/originals_validation.py

      - name: Initialize test database
        run: python -c "from db.store import init_db; init_db()"

      - name: Run backend tests
        run: python -m unittest discover -s tests

      - name: Validate tracked diffs
        run: git diff --check

  mobile:
    name: Mobile contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test telemetry privacy and QA guards
        run: npm run test:telemetry

      - name: Test referral trust boundaries
        run: npm run test:referrals

      - name: Test universal and app links
        run: npm run test:app-links

      - name: Test automation selector contracts
        run: npm run test:automation-selectors

      - name: Test release worktree publication guard
        run: npm run test:release-worktree

      - name: Audit native and release drift
        run: npm run audit:native-drift

      - name: Test trip repository
        run: npm run test:trip-repository

      - name: Test account storage lifecycle
        run: npm run test:account-storage

      - name: Test Trailhead Originals runtime
        run: npm run test:originals

      - name: Audit user-facing copy
        run: npm run audit:copy

      - name: Audit Explorer
        run: npm run audit:explore

      - name: Audit routes
        run: npm run audit:routes

      - name: Audit Profile and Map
        run: npm run audit:profile-map

      - name: Audit Plan workspace
        run: npm run audit:plan-workspace

  android-native:
    name: Android Auto native unit tests
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run Android and Android Auto unit tests
        working-directory: mobile/android
        env:
          RNMAPBOX_MAPS_DOWNLOAD_TOKEN: ${{ secrets.RNMAPBOX_MAPS_DOWNLOAD_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  website:
    name: Website and verified-link contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Build website and association files
        run: npm run build

      - name: Validate Originals preview contract
        run: node dashboard/site/scripts/check-originals-preview.mjs

      - name: Validate tracked diffs
        run: git diff --check
