name: Trailhead CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trailhead-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and catalog contracts
    runs-on: ubuntu-latest
    env:
      TRAILHEAD_DB_PATH: /tmp/trailhead-ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci --ignore-scripts

      - name: Compile backend
        run: python -m py_compile dashboard/server.py db/store.py db/originals_validation.py

      - name: Initialize test database
        run: python -c "from db.store import init_db; init_db()"

      - name: Run backend tests
        run: python -m unittest discover -s tests

      - name: Validate tracked diffs
        run: git diff --check

  mobile:
    name: Mobile contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test telemetry privacy and QA guards
        run: npm run test:telemetry

      - name: Test referral trust boundaries
        run: npm run test:referrals

      - name: Test universal and app links
        run: npm run test:app-links

      - name: Test automation selector contracts
        run: npm run test:automation-selectors

      - name: Test Android map-memory gate contract
        run: npm run test:android-map-memory

      - name: Test Explore image and wildfire memory guards
        run: npm run test:explore-memory-guard && npm run test:fire-overlay

      - name: Test NPS adaptive hub preservation
        run: npm run test:nps-hub-preservation

      - name: Test release worktree publication guard
        run: npm run test:release-worktree

      - name: Audit native and release drift
        run: npm run audit:native-drift

      - name: Test trip repository
        run: npm run test:trip-repository

      - name: Test account storage lifecycle
        run: npm run test:account-storage

      - name: Test Trailhead Originals runtime
        run: npm run test:originals

      - name: Audit user-facing copy
        run: npm run audit:copy

      - name: Audit Explorer
        run: npm run audit:explore

      - name: Audit routes
        run: npm run audit:routes

      - name: Audit Profile and Map
        run: npm run audit:profile-map

      - name: Audit Plan workspace
        run: npm run audit:plan-workspace

  android-native:
    name: Android Auto native unit tests
    runs-on: ubuntu-latest
    # Configure either repository secret as a Mapbox token with DOWNLOADS:READ only.
    # GitHub withholds repository secrets from pull_request workflows opened from forks.
    env:
      RNMAPBOX_MAPS_DOWNLOAD_TOKEN: ${{ secrets.RNMAPBOX_MAPS_DOWNLOAD_TOKEN || secrets.MAPBOX_DOWNLOADS_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Enforce trusted-branch native test policy
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          echo "::error title=Trusted branch required::Android native tests need the repository's read-only Mapbox Maven credential. Fork pull requests cannot receive repository secrets. A maintainer must copy this commit to a trusted repository branch and rerun CI."
          exit 1

      - name: Validate Mapbox Maven credential
        shell: bash
        run: |
          test -n "$RNMAPBOX_MAPS_DOWNLOAD_TOKEN" || {
            echo "::error title=Missing Mapbox credential::Configure RNMAPBOX_MAPS_DOWNLOAD_TOKEN or MAPBOX_DOWNLOADS_TOKEN as a DOWNLOADS:READ repository secret."
            exit 1
          }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run Android and Android Auto unit tests
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  website:
    name: Website and verified-link contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Build website and association files
        run: npm run build

      - name: Validate Originals preview contract
        run: node dashboard/site/scripts/check-originals-preview.mjs

      - name: Validate tracked diffs
        run: git diff --check
