appId: ${APP_ID}
name: Map search opens a complete campground sheet
tags:
  - search
  - map
  - sheets
  - camp
  - current-selectors
---
- launchApp:
    clearState: false
    stopApp: true
- tapOn: "Map tab"
- extendedWaitUntil:
    visible:
      id: "map.search.inline.input"
    timeout: 20000
- tapOn:
    id: "map.search.inline.input"
- eraseText: 80
- inputText: "Goose Island Group Sites"
- extendedWaitUntil:
    visible:
      id: "map.search.inline.result.place:ridb:251841"
    timeout: 30000
- tapOn:
    id: "map.search.inline.result.place:ridb:251841"
- extendedWaitUntil:
    visible:
      id: "place-sheet-camp-camp-place-ridb-251841-peek"
    timeout: 15000
- assertVisible: "Goose Island Group Sites"
- takeScreenshot: map-search-camp-peek
- tapOn:
    id: "place-sheet-camp-camp-place-ridb-251841-view-sites"
- extendedWaitUntil:
    visible:
      id: "place-sheet-camp-camp-place-ridb-251841"
    timeout: 20000
- runFlow:
    when:
      visible: "Some details are unavailable"
    commands:
      - tapOn: "Retry"
      - extendedWaitUntil:
          notVisible: "Some details are unavailable"
          timeout: 30000
- scrollUntilVisible:
    element:
      text: "^Sites$"
    direction: DOWN
    timeout: 30000
    speed: 65
- assertVisible: "Site types"
- assertVisible: "^Sites$"
- takeScreenshot: map-search-camp-full
- tapOn:
    point: "27%, 56%"
- extendedWaitUntil:
    notVisible: "^Sites$"
    timeout: 20000
- takeScreenshot: map-search-campsite-detail
- pressKey: Back
- extendedWaitUntil:
    visible: "^Sites$"
    timeout: 15000
- assertVisible: "Site types"
- assertVisible: "^Sites$"
- takeScreenshot: map-search-camp-restored-scroll
